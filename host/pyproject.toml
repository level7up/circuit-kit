[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-voice-terminal"
version = "0.1.0"
description = "Push-to-talk ESP32-S3 button for Claude Code on macOS"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
claude-voice-terminal = "claude_voice_terminal.main:main"

[tool.setuptools.packages.find]
where = ["src"]
